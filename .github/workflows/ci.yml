name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  smoke:
    name: Config smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm clean-install

      # The peers are not installed here, so this asserts the module parses and
      # its imports resolve in the shape a consumer would load it.
      - name: Assert the config loads and exports a flat config array
        run: npm test
