name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  smoke:
    name: Config smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # On pull_request this checkout is the test merge of PR + base, so this
      # catches markers introduced by resolving conflicts in GitHub's web editor
      # — which is how a broken package-lock.json once reached nswds-design's
      # main. npm reports a lockfile full of markers as a confusing parse error,
      # so name the real problem here rather than leaving it to `npm ci`.
      - name: Check for unresolved merge conflict markers
        run: |
          if git grep -nE '^(<{7}|>{7}) '; then
            echo "::error::Unresolved merge conflict markers found in the files above."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm clean-install

      # The peers are not installed here, so this asserts the module parses and
      # its imports resolve in the shape a consumer would load it.
      - name: Assert the config loads and exports a flat config array
        run: npm test
