name: CI

# No merge_group trigger. The shared merge gate (shared-ci.yml) is
# pull_request-only, so a merge queue would run this job but none of the
# required "install / *" or commitlint contexts — leaving them permanently
# unsatisfiable and the queue stuck. Add it here only alongside the shared stub.
on:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Config smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm clean-install

      # The peers are not installed here, so this asserts the module parses and
      # its imports resolve in the shape a consumer would load it.
      - name: Assert the config loads and exports a flat config array
        run: npm test
